<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Me - Jireh Suarez</title>
  <style>
    /* === GLOBAL STYLES === */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      background: url('your-map-image.jfif')no-repeat center center/cover;
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* === NAVIGATION BAR === */
    nav {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      background: rgba(10, 25, 35, 0.95);
      padding: 15px 60px;
      border-bottom: 1px solid #00ffaa;
      box-shadow: 0 0 10px rgba(0, 255, 170, 0.3);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      margin-left: 20px;
      padding: 8px 18px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      transition: all 0.3s ease;
    }

    nav a:hover {
      background: #00ffaa;
      color: #0b1f2a;
      box-shadow: 0 0 10px #00ffaa;
    }

    /* === MAIN CONTAINER === */
    .contact-container {
      max-width: 1000px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      background: rgba(0, 0, 0, 0.6);
      border-radius: 15px;
      box-shadow: 0 0 25px rgba(0, 255, 170, 0.15);
      padding: 40px;
      backdrop-filter: blur(10px);
      margin-top: 80px;
    }

    .contact-info, .contact-form {
      flex: 1;
    }

    .contact-info {
      padding-right: 30px;
    }

    h1 {
      color: #00ffaa;
      font-size: 28px;
      text-align: center;
      margin-bottom: 30px;
      text-shadow: 0 0 10px rgba(0, 255, 170, 0.6);
    }

    h2 {
      color: #00ffaa;
      margin-bottom: 15px;
      font-size: 18px;
    }

    p, a {
      color: #ccc;
      text-decoration: none;
    }

    a:hover {
      color: #00ffaa;
    }

    /* === CONTACT FORM === */
    form {
      display: flex;
      flex-direction: column;
    }

    input, textarea {
      padding: 12px;
      margin-bottom: 15px;
      border: none;
      border-radius: 25px;
      outline: none;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 14px;
    }

    input::placeholder, textarea::placeholder {
      color: #aaa;
    }

    textarea {
      resize: none;
      height: 100px;
      border-radius: 15px;
    }

    button {
      padding: 12px;
      border: none;
      border-radius: 25px;
      background: #00ffaa;
      color: #0b1f2a;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button:hover {
      background: #00cc88;
      box-shadow: 0 0 10px #00ffaa;
    }

    /* === FOOTER === */
    footer {
      background: rgba(10, 25, 35, 0.95);
      color: #2c2b2b;
      text-align: center;
      padding: 20px;
      border-top: 1px solid rgba(0, 255, 170, 0.3);
      margin-top: auto;
    }

    .footer-links a {
      margin: 0 10px;
      color: #00ffaa;
      text-decoration: none;
    }

    .footer-links a:hover {
      text-decoration: underline;
    }

    /* === RESPONSIVE === */
    @media (max-width: 768px) {
      .contact-container {
        flex-direction: column;
        text-align: center;
      }
      .contact-info {
        padding-right: 0;
        margin-bottom: 30px;
      }
    }
  </style>
</head>
<body>

  <!-- NAVIGATION -->
  <nav>
    <a href="home.html">Home</a>
    <a href="skills.html">Skills</a>
    <a href="portfolio.html">Portfolio</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>

  <!-- CONTACT CONTENT -->
  <div class="contact-container">
    <div class="contact-info">
      <h1>Contact Me</h1>
      <h2>Address</h2>
      <p>Blk17 Lot19 Imus Cavite</p>
      <h2>Phone</h2>
      <p>+961 779 1405</p>
      <h2>Email</h2>
      <p><a href="mailto:jirehsuarez@gmail.com">jirehsuarez@gmail.com</a></p>
    </div>

    <div class="contact-form">
      <h2>Feel free to message me</h2>
      <form>
        <input type="text" placeholder="Your Name" required>
        <input type="email" placeholder="Your Email" required>
        <input type="text" placeholder="Subject">
        <textarea placeholder="Your Message" required></textarea>
        <button type="submit">Send</button>
      </form>
    </div>
  </div>

  <!-- FOOTER -->
  <footer>
    <div class="footer-links">
      <a href="Terms.html">Terms & Conditions</a> |
      <a href="FAQs.html">FAQs</a> |
      <a href="help.html">Help</a>
    </div>
    <p>© 2025 Jireh Suarez. All Rights Reserved.</p>
  </footer>

</body>
</html>
